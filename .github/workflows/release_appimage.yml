on:
  push:
    tags:
      - 'v[0-9].[0-9]'
      - 'v[0-9].[0-9][0-9]'

name: Release AppImage

permissions:
  contents: write
jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: lug-helper-${{ github.ref_name }}.appimage

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: lug helper ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: lug-helper-${{ github.ref_name }}.appimage
